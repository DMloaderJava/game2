<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRAVITY: VOID — MVP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #05050a; }
    canvas { display: block; }
    #hud {
      position: absolute;
      top: 10px; left: 10px;
      color: #e8e8f0; font-family: system-ui, sans-serif;
      pointer-events: none;
    }
    .hud-line { margin: 4px 0; font-size: 14px; }
    .hud-key { color: #7c93ff; font-weight: bold; }
    #controls {
      position: absolute;
      bottom: 10px; left: 10px;
      color: #8a8aa0; font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-line">GRAVITY: VOID — MVP</div>
    <div class="hud-line">Здоровье: <span id="hp">100</span> | Энергия: <span id="en">100</span> | Выносливость: <span id="st">100</span></div>
    <div class="hud-line">Фаза прилива: <span id="tide">Стабильность</span></div>
  </div>
  <div id="controls">
    WASD/Стрелки — движение · Пробел — прыжок · Q — Притяжение · E — Отталкивание
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
