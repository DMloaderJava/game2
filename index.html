<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRAVITY: VOID — MVP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #05050a; }
    canvas { display: block; }

    /* ---------- HUD ---------- */
    #hud {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      font-family: 'Courier New', Courier, monospace;
      color: #e8e8f0;
    }

    /* Статы слева */
    #hud-stats {
      position: absolute;
      top: 24px; left: 24px;
      width: 260px;
      z-index: 10;
    }

    .stat-panel {
      position: relative;
      margin-bottom: 18px;
      padding: 12px 16px;
      background: rgba(10, 10, 16, 0.6);
      border: 1px solid #2a2a4a;
      border-left: 4px solid #4cc9f0;
      box-shadow: 0 0 12px rgba(76, 201, 240, 0.15);
    }

    .stat-panel.warn { border-left-color: #ff9900; box-shadow: 0 0 12px rgba(255, 153, 0, 0.15); }
    .stat-panel.danger { border-left-color: #ff3333; box-shadow: 0 0 12px rgba(255, 51, 51, 0.15); }

    .stat-label {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #8a8aa0;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .stat-value { color: #4cc9f0; font-weight: bold; }

    .stat-bar {
      height: 6px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      overflow: hidden;
      position: relative;
    }

    .stat-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #4cc9f0, #2a6fa5);
      transition: width 0.15s ease, background-color 0.2s;
    }
    .stat-fill.warn { background: linear-gradient(90deg, #ff9900, #cc7a00); }
    .stat-fill.danger { background: linear-gradient(90deg, #ff3333, #aa2222); }

    /* Индикатор прилива справа сверху */
    #hud-tide {
      position: absolute;
      top: 24px; right: 24px;
      z-index: 10;
    }

    .tide-panel {
      padding: 10px 16px;
      background: rgba(10, 10, 16, 0.6);
      border: 1px solid #2a2a4a;
      border-left: 4px solid #7c93ff;
      box-shadow: 0 0 12px rgba(124, 147, 255, 0.15);
    }

    .tide-label {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #8a8aa0;
      margin-bottom: 4px;
    }
    .tide-value { font-size: 16px; font-weight: bold; color: #7c93ff; }

    /* Название игры */
    #hud-title {
      position: absolute;
      top: 20px; left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #4cc9f0;
      opacity: 0.7;
      z-index: 10;
      pointer-events: none;
    }

    /* Элементы управления (снизу) */
    #controls {
      position: absolute;
      bottom: 18px; left: 50%;
      transform: translateX(-50%);
      color: #5a5a7a;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 10;
    }

    /* ---------- Сообщения о подборе ---------- */
    #pickup-toast {
      position: absolute;
      top: 50%; right: 40px;
      transform: translateY(-50%);
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      color: #4cc9f0;
      z-index: 20;
      pointer-events: none;
      display: none;
    }

    .toast-item {
      background: rgba(10, 10, 16, 0.8);
      border: 1px solid #4cc9f0;
      padding: 6px 12px;
      margin: 4px 0;
      box-shadow: 0 0 10px rgba(76, 201, 240, 0.3);
      animation: slideIn 0.25s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Скрыть стандартные HUD элементы, заменяем на стилизованные */
    .legacy-hud { display: none; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="hud-title">Gravity: Void</div>

    <div id="hud-stats">
      <div class="stat-panel" id="hp-panel">
        <div class="stat-label"><span>Здоровье</span><span class="stat-value" id="hp-val">100</span></div>
        <div class="stat-bar"><div class="stat-fill" id="hp-bar" style="width:100%"></div></div>
      </div>

      <div class="stat-panel" id="en-panel">
        <div class="stat-label"><span>Энергия</span><span class="stat-value" id="en-val">100</span></div>
        <div class="stat-bar"><div class="stat-fill" id="en-bar" style="width:100%"></div></div>
      </div>

      <div class="stat-panel" id="st-panel">
        <div class="stat-label"><span>Выносливость</span><span class="stat-value" id="st-val">100</span></div>
        <div class="stat-bar"><div class="stat-fill" id="st-bar" style="width:100%"></div></div>
      </div>
    </div>

    <div id="hud-tide">
      <div class="tide-panel">
        <div class="tide-label">Фаза прилива</div>
        <div class="tide-value" id="tide-val">Стабильность</div>
      </div>
    </div>

    <div id="pickup-toast"></div>

    <div id="controls">
      WASD — движение · Пробел — прыжок · E — добыть / подобрать · I / Tab — инвентарь
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
